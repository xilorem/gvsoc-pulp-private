from gvtest.testsuite import *

import re


PASS_RX = re.compile(
    r'^\[\d+\] tester PASS done_id=3 reordered_responses=1$', re.MULTILINE)
FAIL_RX = re.compile(r'^\[\d+\] tester FAIL .*$', re.MULTILINE)


def _check(test, output, *args, **kwargs):
    if PASS_RX.search(output):
        return True, 'all three tickets completed after reordered AXI responses'
    failure = FAIL_RX.search(output)
    if failure:
        return False, failure.group(0)
    return False, 'no tester PASS / FAIL line in output'


def testset_build(testset):
    testset.set_name('idma')
    testset.set_components(['pulp.idma.reg32_3d_dma'])

    test = testset.new_make_test(
        'axi_write_response_reordering',
        checker=_check,
        build_resource='gvsoc.core.build',
        no_clean=True,
    )
    test.add_description(
        'Completes unequal AXI write chunks out of issue order and checks that '
        'each legacy-iDMA descriptor still reaches DONE_ID.')
